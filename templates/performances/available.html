{% extends 'base.html' %}
{% block content %}<div class="section-heading"><p class="eyebrow">Планирование визита</p><h1>Свободные места</h1><p class="description">Выберите дату, чтобы найти показы с доступными местами.</p></div>
<form method="get" class="panel filters"><label for="date">Дата показа</label><input type="date" id="date" name="date" value="{{ selected_date }}" required><button class="btn btn-primary" type="submit">Найти показы</button></form>
{% if error %}<p class="empty-state" role="alert">{{ error }}</p>{% elif selected_date %}{% include 'includes/schedule.html' %}{% else %}<p class="empty-state">Выберите дату показа.</p>{% endif %}
{% endblock %}
