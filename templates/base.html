{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title|default:"Театр" }}{% endblock %} · Театр</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/style.css' %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'homepage/theatre.svg' %}">
  <script src="{% static 'homepage/main.js' %}" defer></script>
</head>
<body>
  <header class="site-header"><div class="shell header-inner">
    <a class="brand" href="{% url 'homepage:index' %}">
      <img class="brand-symbol" src="{% static 'homepage/theatre.svg' %}" width="44" height="44" alt="Театр">
      <span>Театр<small>Управление постановками</small></span>
    </a>
    {% include 'includes/navigation.html' %}
  </div></header>
  <main class="shell main-content">{% block content %}{% endblock %}</main>
  <footer class="shell site-footer">Театр · Система управления театральными постановками</footer>
</body>
</html>
